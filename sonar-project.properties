# SonarQube Server / SonarQube Cloud configuration.
#
# TODO (needs repository owner): create the project, then set the key below.
# For SonarQube Cloud also set sonar.organization and disable Automatic
# Analysis (coverage import requires CI-based analysis). Never commit tokens;
# the CI job reads SONAR_TOKEN from repository secrets.
#
# sonar.projectKey=<set-me>
# sonar.organization=<set-me-for-sonarqube-cloud>

sonar.projectName=senior-dev-solutions
sonar.sourceEncoding=UTF-8

sonar.sources=src,backend/src,backend/server.js,scripts
sonar.tests=src,backend/test
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx,backend/test/**/*.js
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,backend/coverage/**,**/*.sql,src/components/ui/**
sonar.coverage.exclusions=src/components/ui/**,scripts/**,backend/scripts/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info,backend/coverage/lcov.info
